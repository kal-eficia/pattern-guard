[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pattern-guard"
version = "1.0.0"
description = "Catch guessable answer patterns (runs, staircases, alternation, cycles) in multiple-choice and sort tasks, and fix them."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kalid Nur" }]
keywords = ["education", "quiz", "assessment", "multiple-choice", "teachers", "edtech"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Education",
  "Topic :: Education :: Testing",
]

[project.scripts]
pattern-guard = "pattern_guard.cli:main"

[tool.setuptools]
packages = ["pattern_guard"]
